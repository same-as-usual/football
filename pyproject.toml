[project]
name = "football"
version = "0.1.0"
description = "The explorable, explainable football match — free, in your browser."
requires-python = ">=3.11"
dependencies = [
    "statsbombpy>=1.14",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/core", "packages/adapters", "packages/licensing", "packages/pipeline", "services/api"]
include = ["football_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
